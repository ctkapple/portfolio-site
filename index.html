<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>William Dooling — Product Designer</title>
<meta name="description" content="Product designer. Risk PM by day, game dev by night. A fantasy football stats platform and a roguelite deckbuilder.">
<link rel="canonical" href="https://www.williamdooling.com/">
<meta name="theme-color" content="#0A0A0A">

<meta property="og:title" content="William Dooling — Product Designer">
<meta property="og:description" content="Risk PM by day, game dev by night.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.williamdooling.com/">
<!-- Absolute by necessity: crawlers don't resolve relative og: URLs. -->
<meta property="og:image" content="https://www.williamdooling.com/assets/img/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Quicksand:wght@300..700&display=swap">
<link rel="stylesheet" href="assets/styles.css">

<script>
/* Paints the arrival fog before the first frame of this document, so the two
   halves of the transition read as one continuous piece of weather. Pure
   progressive enhancement: if this never runs, no class is set and the page
   renders normally. Dissipation is CSS-driven — see .is-arriving in styles.css. */
(function () {
  try {
    var raw = sessionStorage.getItem('wd:mist');
    if (!raw) return;
    var m = JSON.parse(raw);
    if (!m || Date.now() - m.t > 6000) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var s = document.documentElement.style;
    s.setProperty('--ox', m.ox + 'px');
    s.setProperty('--oy', m.oy + 'px');
    s.setProperty('--mist-max', m.max + 'px');
    s.setProperty('--tint', m.tint);
    document.documentElement.classList.add('is-arriving');
  } catch (e) {}
})();
</script>
</head>
<body class="home">

  <!-- Ambient fog. Always on, independent of the click transition — the page
       should read as weather even when nothing is happening. Three parallax
       sheets over a static vignette mask; see §3b of styles.css. -->
  <div class="fog" aria-hidden="true">
    <div class="fog__sheet fog__sheet--far"></div>
    <div class="fog__sheet fog__sheet--mid"></div>
    <div class="fog__sheet fog__sheet--near"></div>
  </div>

  <header class="marquee">
    <!-- The name is deliberately not shown here. The domain already says it,
         and it returns inside the profile dot below the cards. It stays as a
         visually hidden h1 so the document still has a heading and so search
         engines and screen readers get the name — removing it outright would
         leave the page anonymous to both. -->
    <h1 class="vh">William Dooling</h1>
    <p class="micro marquee__label">Product Design Portfolio</p>
  </header>

  <main class="roster">

    <a class="card card--bev" href="work/bevfantasy/" data-mist data-label="bevfantasy">
      <div class="card__float">
        <div class="card__tilt">
          <div class="card__inner">
            <span class="card__sheen" aria-hidden="true"></span>

            <div class="card__art">
              <!-- Placeholder for real product UI. §6 left screenshot-vs-mock open;
                   Will has since chosen a real, tightly-cropped capture. This slot
                   is sized 16:10 to receive it — drop an <img> in and delete .mock. -->
              <div class="mock" aria-hidden="true">
                <div class="mock__head">
                  <span class="mock__title">AP Poll</span>
                  <span class="mock__week">WK 12</span>
                </div>
                <div class="mock__rows">
                  <div class="mock__row"><span class="mock__rank">1</span><span class="mock__track"><span class="mock__bar" style="--w:94%"></span></span><span class="mock__delta mock__delta--up">+2</span></div>
                  <div class="mock__row"><span class="mock__rank">2</span><span class="mock__track"><span class="mock__bar" style="--w:81%"></span></span><span class="mock__delta">—</span></div>
                  <div class="mock__row"><span class="mock__rank">3</span><span class="mock__track"><span class="mock__bar" style="--w:67%"></span></span><span class="mock__delta mock__delta--up">+4</span></div>
                  <div class="mock__row"><span class="mock__rank">4</span><span class="mock__track"><span class="mock__bar" style="--w:58%"></span></span><span class="mock__delta">−1</span></div>
                  <div class="mock__row"><span class="mock__rank">5</span><span class="mock__track"><span class="mock__bar" style="--w:44%"></span></span><span class="mock__delta">—</span></div>
                </div>
              </div>
            </div>

            <div class="card__foot">
              <div>
                <h2 class="card__title">bevfantasy</h2>
                <p class="card__meta">Fantasy football stats platform</p>
              </div>
              <span class="card__status">Live</span>
            </div>
          </div>
        </div>
      </div>
    </a>

    <a class="card card--storm" href="work/into-the-storm/" data-mist data-label="Into the Storm">
      <div class="card__float">
        <div class="card__tilt">
          <div class="card__inner">
            <span class="card__sheen" aria-hidden="true"></span>

            <div class="card__art">
              <img src="assets/img/into-the-storm-capsule.webp" alt=""
                   width="1000" height="625" loading="eager" decoding="async">
            </div>

            <div class="card__foot">
              <div>
                <h2 class="card__title">Into the Storm</h2>
                <p class="card__meta">Roguelite deckbuilder</p>
              </div>
              <span class="card__status">In alpha</span>
            </div>
          </div>
        </div>
      </div>
    </a>

  </main>

  <footer class="site-foot">
    <!-- The identity, condensed to a single glowing dot so the two cards keep
         the page. Everything personal lives inside the panel it opens. -->
    <div class="me">
      <!-- Darkens the page behind while a photo is being examined. Fixed, and
           .me carries no transform, so it stays viewport-anchored. -->
      <div class="me__veil" aria-hidden="true"></div>

      <button class="me__dot" type="button" aria-expanded="false" aria-controls="me-panel">
        <!-- The liquid fill. Clips to the button's (morphing) shape and holds
             two counter-rotating blobs whose upper edges read as a wobbling
             surface. Hover raises the level. -->
        <span class="me__liquid" aria-hidden="true"></span>
        <span class="me__dot-label">me</span>
        <span class="vh">— about William Dooling</span>
        <span class="me__halo" aria-hidden="true"></span>
      </button>

      <!-- `hidden` is removed by main.js on open. Kept in the markup so the
           panel is genuinely inert (and unfocusable) when closed, rather than
           merely transparent. -->
      <!-- role=dialog without aria-modal: the panel does not trap focus and the
           rest of the page stays reachable, so claiming modality would be a
           lie to assistive tech. Esc closes it and focus returns to the dot. -->
      <div class="me__panel" id="me-panel" role="dialog"
           aria-label="About William Dooling" hidden>

        <div class="me__shots">
          <figure class="me__bubble me__shot me__bubble--sky" tabindex="0">
            <img src="assets/img/skydive.webp" alt="William skydiving over a lake."
                 width="320" height="320" loading="lazy" decoding="async">
          </figure>
          <figure class="me__bubble me__shot me__bubble--run" tabindex="0">
            <img src="assets/img/marathon.webp" alt="William running a marathon."
                 width="320" height="320" loading="lazy" decoding="async">
          </figure>
          <div class="me__portrait me__shot" tabindex="0">
            <img src="assets/img/will-and-gibbles.webp"
                 alt="William Dooling with his dog."
                 width="360" height="360" loading="lazy" decoding="async">
          </div>
        </div>

        <!-- The motto is set on an arc that mirrors the portrait's lower edge,
             so it reads as hugging the circle rather than sitting in a box
             beneath it. role/aria-label carry the text, since a <textPath> is
             not reliably announced. -->
        <svg class="me__motto" viewBox="0 0 320 50" aria-hidden="true" focusable="false">
          <path id="me-motto-arc" d="M 22 6 Q 160 48 298 6" fill="none"/>
          <text>
            <textPath href="#me-motto-arc" startOffset="50%" text-anchor="middle">
              Risk PM by day, game dev by night.
            </textPath>
          </text>
        </svg>
        <p class="vh">Risk PM by day, game dev by night.</p>

        <p class="me__name">William Dooling</p>

        <nav class="me__links" aria-label="Contact">
          <button class="me__link me__copy" type="button"
                  data-copy="william.dooling@outlook.com">
            <span class="me__copy-label">Email</span>
            <span class="me__copy-done" aria-hidden="true">Copied</span>
          </button>
          <a class="me__link" href="https://www.linkedin.com/in/wgd/"
             target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <!-- Placeholder destination — real URL is Will's to supply. -->
          <a class="me__link" href="https://site.com/about">About</a>
        </nav>

        <p class="me__status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </footer>

  <!-- Mist. Duplicated on every page rather than injected, because the arrival
       half must exist in the very first painted frame. -->
  <div class="mist" aria-hidden="true">
    <div class="mist__blur"></div>
    <div class="mist__veil"></div>
    <div class="mist__wisp mist__wisp--c"></div>
    <div class="mist__wisp mist__wisp--a"></div>
    <div class="mist__wisp mist__wisp--b"></div>
    <div class="mist__label"><span></span></div>
  </div>

  <svg class="mist-defs" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <!-- Static noise: filters resolve before masking, so expanding the mask
           never re-rasterizes the turbulence. The fog is warped once. -->
      <filter id="mist-warp-a" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.011" numOctaves="4" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="170" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="mist-warp-b" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.006" numOctaves="3" seed="23" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <script src="assets/main.js"></script>
</body>
</html>
