<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in the fog — William Dooling</title>
<meta name="description" content="That page doesn't exist.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Fonts are self-hosted; @font-face lives in styles.css. Preloaded because a
     font declared inside a stylesheet is discovered a round trip late, and
     `crossorigin` is mandatory even same-origin — fonts fetch in CORS mode.
     See index.html for the full reasoning. -->
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/assets/fonts/quicksand-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/assets/fonts/inter-latin.woff2">

<link rel="stylesheet" href="/assets/styles.css?v=a20">

<script>
/* Paints the arrival fog before this document's first frame. See assets/main.js. */
(function () {
  /* Marks JS as alive before first paint. Scroll-reveal CSS hides its elements
     only under this class, so a page whose scripts never load still shows all
     of its content. */
  document.documentElement.classList.add('js');
  try {
    var raw = sessionStorage.getItem('wd:mist');
    if (!raw) return;
    var m = JSON.parse(raw);
    if (!m || Date.now() - m.t > 6000) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var s = document.documentElement.style;
    s.setProperty('--ox', m.ox + 'px');
    s.setProperty('--oy', m.oy + 'px');
    s.setProperty('--mist-max', m.max + 'px');
    s.setProperty('--tint', m.tint);
    document.documentElement.classList.add('is-arriving');
  } catch (e) {}
})();
</script>
</head>
<body class="notfound">
  <h1>404</h1>
  <p>You've wandered off into the fog.</p>
  <p><a href="/" data-mist data-label="William Dooling">Back to the homepage</a></p>

  <div class="mist" aria-hidden="true">
    <div class="mist__blur"></div>
    <div class="mist__veil"></div>
    <div class="mist__wisp mist__wisp--c"></div>
    <div class="mist__wisp mist__wisp--a"></div>
    <div class="mist__wisp mist__wisp--b"></div>
    <div class="mist__label"><span></span></div>
  </div>

  <svg class="mist-defs" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <filter id="mist-warp-a" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.011" numOctaves="4" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="170" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="mist-warp-b" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.006" numOctaves="3" seed="23" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <script src="/assets/main.js?v=a20"></script>
</body>
</html>
