<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050811">
  <title>Selection Wheel</title>
  <meta name="description" content="A browser-local custom selection wheel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Zen+Dots&display=swap">
  <link rel="stylesheet" href="wheel.css?v=51d8ae0">
  <script src="wheel.js?v=51d8ae0" defer></script>
</head>
<body>
  <div class="ambient-field" aria-hidden="true">
    <span class="ambient-field__grid"></span>
    <span class="ambient-field__bloom ambient-field__bloom--cyan"></span>
    <span class="ambient-field__bloom ambient-field__bloom--violet"></span>
    <span class="ambient-field__stars"></span>
  </div>

  <main class="app-shell">
    <aside class="side-rail side-rail--left setup-only" aria-label="Wheel setup">
      <section class="editor-section editor-section--add" aria-labelledby="add-heading">
        <div class="section-heading section-heading--with-total">
          <h2 id="add-heading">Rewards</h2>
          <output class="entry-total" id="entry-total">0 / 60</output>
        </div>

        <div id="reward-source-rail">
          <div class="reward-source" id="reward-source">
            <div class="quantity-row">
              <label class="field quantity-field">
                <span>Quantity</span>
                <input id="shared-quantity" name="quantity" type="number" min="1" max="60" step="1" value="1" inputmode="numeric" required>
              </label>
            </div>

            <div class="tier-chips" aria-label="Reward choices">
              <button class="tier-chip tier-chip--ur" type="button" data-reward="ur"><img src="UR_Craft_Asset.png" alt=""><span>1</span></button>
              <button class="tier-chip tier-chip--packs" type="button" data-reward="packs"><img src="The_Masters_Saga-Pack-Master_Duel.png" alt=""><span>1</span></button>
              <button class="tier-chip tier-chip--bans" type="button" data-reward="bans"><img src="Ban_Asset.png" alt=""><span>1</span></button>
              <button class="tier-chip tier-chip--sr" type="button" data-reward="sr"><img src="SR_Craft_asset.png" alt=""><span>1</span></button>
              <button class="tier-chip tier-chip--r" type="button" data-reward="r"><img src="R_Craft_asset.png" alt=""><span>1</span></button>
              <button class="tier-chip tier-chip--n" type="button" data-reward="n"><img src="N_Craft_asset.png" alt=""><span>1</span></button>
              <button class="tier-chip tier-chip--nr" type="button" data-reward="nr"><img src="N_R_Craft_asset.png" alt=""><span>1</span></button>
              <button class="tier-chip tier-chip--custom" id="custom-gem-submit" type="submit" form="custom-entry-form" disabled aria-label="Add custom reward" title="Enter custom reward text first"><img src="Master_Duel_Gem.png" alt=""><span>1</span></button>
            </div>

            <form class="custom-entry" id="custom-entry-form">
              <label class="field field--label">
                <span>Custom Reward</span>
                <input id="custom-label" name="label" type="text" maxlength="48" autocomplete="off" placeholder="eg. legacy craft" required>
              </label>
            </form>
          </div>
        </div>

        <button class="composer-toggle" id="composer-toggle" type="button" aria-expanded="false" aria-controls="entry-composer">Advanced Reward Builder</button>
      </section>

      <p class="editor-status" id="editor-status" role="status" aria-live="polite"></p>
    </aside>

    <section class="wheel-stage" aria-label="Selection wheel">
      <header class="wheel-identity" id="wheel-identity">
        <img id="wheel-identity-icon" src="Genex_Controller-Icon-Master_Duel.png" alt="">
        <h1 id="wheel-identity-name">Custom Wheel</h1>
        <img id="wheel-identity-icon-end" src="Genex_Controller-Icon-Master_Duel.png" alt="">
      </header>

      <div class="wheel-shell" id="wheel-shell">
        <div class="wheel-aura" aria-hidden="true"></div>
        <div class="winner-reveal" aria-hidden="true"></div>
        <div class="wheel-pointer" id="wheel-pointer" aria-hidden="true">
          <span></span>
        </div>

        <svg class="wheel" id="wheel" viewBox="0 0 600 600" role="img" aria-labelledby="wheel-title wheel-description">
          <title id="wheel-title">Selection wheel</title>
          <desc id="wheel-description">The wheel is empty. Add a reward to begin.</desc>
          <defs>
            <radialGradient id="empty-wheel-fill" cx="50%" cy="42%" r="62%">
              <stop offset="0" stop-color="#131d31"/>
              <stop offset="0.72" stop-color="#090e1a"/>
              <stop offset="1" stop-color="#050811"/>
            </radialGradient>
            <!-- The rim metal. Its four stops are themed per preset from --rim-1..4, so the
                 wheel's identity reads off the frame rather than off the slice faces. -->
            <linearGradient id="wheel-rim-metal" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--rim-1)"/>
              <stop offset="0.34" stop-color="var(--rim-2)"/>
              <stop offset="0.68" stop-color="var(--rim-3)"/>
              <stop offset="1" stop-color="var(--rim-4)"/>
            </linearGradient>
            <filter id="slice-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="7" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <circle class="wheel__back" cx="300" cy="300" r="276"/>
          <g class="wheel__rotor" id="wheel-rotor"></g>
          <g class="wheel__fixed" aria-hidden="true">
            <circle class="wheel__inner-ring" cx="300" cy="300" r="278"/>
            <circle class="wheel__rim" cx="300" cy="300" r="288"/>
          </g>
        </svg>

        <div class="snow-field" id="snow-field" aria-hidden="true"></div>
        <div class="winner-particles" id="winner-particles" aria-hidden="true"></div>

        <article class="result-card" id="result-card" tabindex="-1" aria-hidden="true">
          <div class="result-card__primary" id="result-primary"></div>
          <div class="result-card__alternatives" id="result-alternatives"></div>
        </article>

        <button class="spin-button" id="spin-button" type="button" aria-label="Spin the wheel" disabled>
          <span class="spheal-rotator" id="spheal-rotator">
            <span class="spheal-reactor" id="spheal-reactor">
              <span class="spheal-crop">
                <img src="SphealGen3Sprite.png" alt="" draggable="false">
              </span>
              <span class="spheal-pulse" id="spheal-pulse" aria-hidden="true"></span>
            </span>
          </span>
          <span class="sr-only" id="spin-count">No rewards</span>
        </button>

        <p class="empty-wheel setup-only" id="empty-wheel">Add rewards to activate the wheel</p>
      </div>
      <section class="saved-wheel-dock setup-only" aria-label="Saved wheels">
        <div class="saved-wheel-dock__list" id="preset-list" role="list"></div>
        <button class="saved-wheel-dock__new" id="new-wheel-button" type="button" aria-label="Create a new wheel" title="New wheel">+</button>
      </section>
    </section>

    <aside class="side-rail side-rail--right setup-only" aria-label="Wheel controls">
      <section class="editor-section editor-section--slices" aria-labelledby="slices-heading">
        <div class="section-heading">
          <h2 id="slices-heading">Reward Order</h2>
        </div>
        <ol class="slice-list" id="slice-list">
          <li class="empty-list">No rewards yet.</li>
        </ol>
      </section>
    </aside>
  </main>

  <div class="utility-chips utility-chips--left setup-only" aria-label="Admin controls">
    <button class="admin-chip" id="admin-toggle" type="button" aria-expanded="false" aria-controls="admin-popover">Admin</button>
    <section class="admin-popover" id="admin-popover" aria-label="Wheel administration" tabindex="-1" hidden>
      <label class="toggle-control">
        <input id="rigged-toggle" type="checkbox">
        <span aria-hidden="true"></span>
        <b>Enable</b>
      </label>
      <label class="field">
        <span>Choose what the wheel lands on</span>
        <select id="rigged-winner" disabled>
          <option value="">Choose a reward</option>
        </select>
      </label>
    </section>
  </div>

  <div class="utility-chips" aria-label="Page utilities">
    <button class="sound-chip" id="sound-toggle" type="button" aria-pressed="true">Sound on</button>
    <a class="feedback-chip" href="https://forms.gle/cAHrPmv7hJ1EaCwV8" target="_blank" rel="noopener noreferrer">Feedback</a>
  </div>

  <dialog class="wheel-dialog" id="reward-dialog" aria-labelledby="composer-heading">
    <section class="entry-composer" id="entry-composer" aria-labelledby="composer-heading">
      <div class="composer-heading">
        <h3 id="composer-heading">Advanced Reward Builder</h3>
        <button class="composer-close" id="composer-close" type="button" aria-label="Close reward editor">×</button>
      </div>

      <div class="composer-simple" id="composer-simple">
        <div class="simple-expression" id="simple-expression" aria-label="Combined reward expression"></div>
      </div>

      <section class="composer-source" id="composer-source-mount" aria-label="Reward choices"></section>
      <p class="composer-validation" id="composer-validation" role="alert"></p>
      <div class="composer-actions"><button class="small-button" id="composer-reset" type="button">Reset</button><button class="add-button" id="composer-submit" type="button">Add reward to wheel</button></div>
    </section>
  </dialog>

  <dialog class="wheel-dialog wheel-dialog--new" id="new-wheel-dialog" aria-labelledby="new-wheel-title">
    <form id="new-wheel-form">
      <h2 id="new-wheel-title">New wheel</h2>
      <label class="field"><span>Name</span><input id="new-wheel-name" type="text" maxlength="48" autocomplete="off" placeholder="Custom Wheel" required></label>
      <fieldset class="preset-icon-picker"><legend>Icon</legend><label><input type="radio" name="newWheelIcon" value="condemned" checked><img src="Condemned_Darklord-Icon-Master_Duel.png" alt="Condemned Darklord"></label><label><input type="radio" name="newWheelIcon" value="eldlich"><img src="Eldlich_the_Golden_Lord-Icon-Master_Duel.png" alt="Eldlich the Golden Lord"></label><label><input type="radio" name="newWheelIcon" value="genex"><img src="Genex_Controller-Icon-Master_Duel.png" alt="Genex Controller"></label></fieldset>
      <p class="dialog-validation" id="new-wheel-validation" role="alert"></p>
      <div class="dialog-actions"><button class="dialog-button dialog-button--cancel" type="button" value="cancel" id="new-wheel-cancel">Cancel</button><button class="dialog-button dialog-button--confirm" type="submit">Create wheel</button></div>
    </form>
  </dialog>

  <dialog class="confirm-dialog" id="confirm-dialog" aria-label="Warning" aria-describedby="confirm-message">
    <form method="dialog">
      <p class="dialog-kicker dialog-kicker--warning">Warning!</p>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="dialog-button dialog-button--cancel" value="cancel">Cancel</button>
        <button class="dialog-button dialog-button--confirm" id="confirm-action" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <p class="sr-only" id="result-announcement" aria-live="assertive"></p>
</body>
</html>
