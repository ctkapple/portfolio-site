<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050811">
  <title>Selection Wheel</title>
  <meta name="description" content="A browser-local custom selection wheel.">
  <link rel="stylesheet" href="wheel.css">
  <script src="wheel.js" defer></script>
</head>
<body>
  <div class="ambient-field" aria-hidden="true">
    <span class="ambient-field__grid"></span>
    <span class="ambient-field__bloom ambient-field__bloom--cyan"></span>
    <span class="ambient-field__bloom ambient-field__bloom--violet"></span>
    <span class="ambient-field__stars"></span>
  </div>

  <main class="app-shell">
    <aside class="side-rail side-rail--left setup-only" aria-label="Wheel setup">
      <section class="editor-section editor-section--add" aria-labelledby="add-heading">
        <div class="section-heading">
          <h2 id="add-heading">Add entries</h2>
          <output class="entry-total" id="entry-total">0 / 60</output>
        </div>

        <label class="field quantity-field">
          <span>Quantity</span>
          <input id="shared-quantity" name="quantity" type="number" min="1" max="60" step="1" value="1" inputmode="numeric" required>
        </label>

        <div class="tier-chips" aria-label="Preset entries">
          <button class="tier-chip tier-chip--ur" type="button" data-tier="ur" data-label="1 UR">
            <span>1 UR</span><small>Add ×1</small>
          </button>
          <button class="tier-chip tier-chip--sr" type="button" data-tier="sr" data-label="2 SR">
            <span>2 SR</span><small>Add ×1</small>
          </button>
          <button class="tier-chip tier-chip--r" type="button" data-tier="r" data-label="3 R">
            <span>3 R</span><small>Add ×1</small>
          </button>
        </div>

        <form class="custom-entry" id="custom-entry-form">
          <label class="field field--label">
            <span>Custom label</span>
            <input id="custom-label" name="label" type="text" maxlength="48" autocomplete="off" placeholder="Redemption" required>
          </label>
          <button class="add-button" type="submit">Add ×1</button>
        </form>
      </section>

      <details class="editor-section editor-section--presets saved-wheels" id="saved-wheels">
        <summary>
          <span>Saved wheels</span>
          <span class="section-note">This browser only.</span>
        </summary>
        <div class="saved-wheels__content">
          <form class="save-preset" id="save-preset-form">
            <label class="field">
              <span>Preset name</span>
              <input id="preset-name" name="presetName" type="text" maxlength="48" autocomplete="off" placeholder="Friday draw" required>
            </label>
            <button class="save-button" type="submit">Save wheel</button>
          </form>

          <ul class="preset-list" id="preset-list">
            <li class="empty-list">No saved wheels.</li>
          </ul>
        </div>
      </details>

      <p class="editor-status" id="editor-status" role="status" aria-live="polite"></p>
    </aside>

    <section class="wheel-stage" aria-label="Selection wheel">

      <div class="wheel-shell" id="wheel-shell">
        <div class="wheel-aura" aria-hidden="true"></div>
        <div class="wheel-pointer" id="wheel-pointer" aria-hidden="true">
          <span></span>
        </div>

        <svg class="wheel" id="wheel" viewBox="0 0 600 600" role="img" aria-labelledby="wheel-title wheel-description">
          <title id="wheel-title">Selection wheel</title>
          <desc id="wheel-description">The wheel is empty. Add an entry to begin.</desc>
          <defs>
            <radialGradient id="empty-wheel-fill" cx="50%" cy="42%" r="62%">
              <stop offset="0" stop-color="#131d31"/>
              <stop offset="0.72" stop-color="#090e1a"/>
              <stop offset="1" stop-color="#050811"/>
            </radialGradient>
            <filter id="slice-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="7" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <circle class="wheel__back" cx="300" cy="300" r="276"/>
          <g class="wheel__rotor" id="wheel-rotor"></g>
          <g class="wheel__fixed" aria-hidden="true">
            <circle class="wheel__inner-ring" cx="300" cy="300" r="278"/>
            <circle class="wheel__rim" cx="300" cy="300" r="288"/>
          </g>
          <g class="winner-callout" id="winner-callout" aria-hidden="true"></g>
        </svg>

        <button class="spin-button" id="spin-button" type="button" aria-label="Spin the wheel" disabled>
          <span class="spheal-rotator" id="spheal-rotator">
            <span class="spheal-reactor" id="spheal-reactor">
              <span class="spheal-crop">
                <img src="SphealGen3Sprite.png" alt="" draggable="false">
              </span>
              <span class="spheal-pulse" id="spheal-pulse" aria-hidden="true"></span>
            </span>
          </span>
          <span class="sr-only" id="spin-count">No entries</span>
        </button>

        <p class="empty-wheel setup-only" id="empty-wheel">Add entries to activate the wheel</p>
      </div>
    </section>

    <aside class="side-rail side-rail--right setup-only" aria-label="Wheel controls">
      <section class="editor-section rigged-card" aria-labelledby="rigged-heading">
        <div class="section-heading">
          <h2 id="rigged-heading">Rigged</h2>
          <label class="toggle-control">
            <input id="rigged-toggle" type="checkbox">
            <span aria-hidden="true"></span>
            <b>Enable</b>
          </label>
        </div>
        <label class="field">
          <span>Forced winner</span>
          <select id="rigged-winner" disabled aria-describedby="rigged-note">
            <option value="">Choose an entry</option>
          </select>
        </label>
        <p class="section-note" id="rigged-note">Targets one unique wheel entry.</p>
      </section>

      <section class="editor-section editor-section--slices" aria-labelledby="slices-heading">
        <div class="section-heading">
          <h2 id="slices-heading">Wheel order</h2>
          <p class="section-note">Order changes position, not odds.</p>
        </div>
        <ol class="slice-list" id="slice-list">
          <li class="empty-list">No entries yet.</li>
        </ol>
      </section>
    </aside>
  </main>

  <a class="feedback-chip" href="https://forms.gle/cAHrPmv7hJ1EaCwV8" target="_blank" rel="noopener noreferrer">Feedback</a>

  <dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog">
      <p class="dialog-kicker">Confirm action</p>
      <h2 id="confirm-title">Continue?</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="dialog-button dialog-button--cancel" value="cancel">Cancel</button>
        <button class="dialog-button dialog-button--confirm" id="confirm-action" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <p class="sr-only" id="result-announcement" aria-live="assertive"></p>
</body>
</html>
