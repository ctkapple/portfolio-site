<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <!-- Far fog: coarser, deeper, slower-moving banks. Tinted to the mist-core
       token, #6B54A8. Same bake-once principle as fog-a.svg, and the same
       no-double-hyphen rule in comments. -->
  <filter id="fog" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0052" numOctaves="3"
                  seed="29" stitchTiles="stitch"/>
    <feColorMatrix type="matrix"
      values="0 0 0 0 0.420
              0 0 0 0 0.329
              0 0 0 0 0.659
              0 0 0 -1.30 0.95"/>
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <rect width="900" height="900" filter="url(#fog)"/>
</svg>
